<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>CodeFUN</title>
		<meta name="author" content="Andrew Cook">
		<link rel="stylesheet" type="text/css" href="codefun.css">
	</head>
	<body>

		<div id="grid-container">

			<header>

				<h1>Code<i>FUN</i></h1>
				<nav>
					<div id="navbar">
						<div id="navbutton"><a href="index.html">Home</a></div>
						<div id="navbutton"><a href="how-to.html">How to Play</a></div>
						<div id="navbutton"><a href="testimonials.html">Testimonials</a></div>
						<div id="navbutton"><a href="contact-us.html" class="active">Contact Us</a></div>
					</div>
				</nav>
			
			</header>

			<main>
				
				<div id="main-container">
					<section>
						<h2>Contact Us</h2>	
							<p>
								If you'd like to learn more about CodeFUN, have any questions, or just want to leave general feedback, please use the form below:
							</p>
					</section>

					<section>
						<div id="contact-form">
							<form>
								<p>
									<label for="first">First Name:</label>
									<input type="text" placeholder="First Name">
								</p>
								<p>
									<label for="last">Last Name:</label>
									<input type="text" placeholder="Last Name">
								</p>
								<p>
									<label for="email">E-Mail:</label>
									<input type="text" placeholder="E-Mail">
								</p>
								<p>
									<label for="message">Message:</label>
									<textarea placeholder="Message" rows="7" cols="50"></textarea>
								</p>
								<input type="submit">
							</form>
						</div>
					</section>
				</div>

			</main>

			<footer>
				<a href="https://validator.w3.org/check?uri=referer" referrerpolicy="unsafe-url"> Validate HTML </a> <br>
				
				<a href="https://jigsaw.w3.org/css-validator/check/referer"
				referrerpolicy="unsafe-url"> Validate CSS </a>
			</footer>

		</div>

	</body>
